name: Dependabot auto-merge

# pull_request_target：Dependabot 触发的 pull_request 工作流只拿到只读 token，
# 这里用 target 版本（在主干上下文里跑，不 checkout PR 代码），确保 GITHUB_TOKEN 有写权限。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # 只处理 Dependabot 自己开的 PR，人手开的 PR 一律不碰
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 读取更新类型
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 小版本/补丁挂 auto-merge：等 main 上配置的必需检查（CI 两个 job）全绿后自动 squash 合并。
      # 不要用 `gh pr checks --watch` —— 本 job 自己也是 PR 的一个 check，会等自己而卡死。
      - name: 小版本挂自动合并
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
